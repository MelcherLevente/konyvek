<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvek</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <input type="text" placeholder="Könyv címe" id="cim">
        <input type="text" placeholder="Szerző" id="szerzo">
        <input type="number" placeholder="Kiadás éve" id="kiadas">
        <input type="number" placeholder="Oldalszám" id="oldalszam">
        <button onclick="konyvHozzaadas()">Könyv hozzáadása</button>
    </div>

    <div>
        <button onclick="betoltes(konyvek)">Összes könyv</button>
        <button onclick="szabadKonyvek()">Szabad könyvek</button>
        <button>Legrégebbi könyvek</button>
        <button>Legvastagabb könyv</button>
        <button>Átlagos oldalszám</button>
    </div>

    <table id="tablazat">
        <thead>
            <tr>
                <th>Cím</th>
                <th>Szerző</th>
                <th>Kiadás éve</th>
                <th>Oldalszám</th>
                <th>Állapot</th>
                <th>Kölcsönzés/Visszahozás</th>
            </tr>
        </thead>
        <tbody id="tablazatTorzs">
            
        </tbody>
    </table>

<script src="main.js"></script>
</body>
</html>
