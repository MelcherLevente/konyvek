<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvek</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <input type="text" placeholder="Könyv címe" id="cim">
        <input type="text" placeholder="Szerző" id="szerzo">
        <select id="kategoria">
            <option value="Regény">Regény</option>
            <option value="Sci-fi">Sci-fi</option>
            <option value="Történelmi">Történelmi</option>
            <option value="Fantasy">Fantasy</option>
        </select>
        <input type="number" placeholder="Kiadás éve" id="kiadas">
        <input type="number" placeholder="Oldalszám" id="oldalszam">
        <button onclick="konyvHozzaadas()">Könyv hozzáadása</button>
    </div>

    <p id="errorUzenet"></p>

    <div>
        <button onclick="betoltes(konyvek)">Összes könyv</button>
        <button onclick="szabadKonyvek()">Szabad könyvek</button>
        <button onclick="legregebbiKonyv()">Legrégebbi könyv</button>
        <button onclick="legvastagabbKonyv()">Legvastagabb könyv</button>
        <button onclick="atlagosOldalszam()">Átlagos oldalszám</button>

        <select id="kategoriaLista" onchange="kategoriaSzerint()">
            <option value="Regény">Regény</option>
            <option value="Sci-fi">Sci-fi</option>
            <option value="Történelmi">Történelmi</option>
            <option value="Fantasy">Fantasy</option>
        </select>
    </div>

    <table id="tablazat">
        <thead>
            <tr>
                <th>Cím</th>
                <th>Szerző</th>
                <th>Kategória</th>
                <th>Kiadás éve</th>
                <th>Oldalszám</th>
                <th>Állapot</th>
                <th>Kölcsönzés/Visszahozás</th>
                <th>Törlés</th>
            </tr>
        </thead>
        <tbody id="tablazatTorzs">
            
        </tbody>
    </table>

    <p id="legregebbi"></p>
    <p id="legvastagabb"></p>
    <p id="atlagosOldalszam"></p>

<script src="main.js"></script>
</body>
</html>
